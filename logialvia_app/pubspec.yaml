name: logialvia_app
description: LogiALVIA - Gestion integree ALLMANY ET COMPAGNIE
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Localisation francaise des composants Material (Doc A1 §5)
  flutter_localizations:
    sdk: flutter

  # State management (Doc C1 §2 — Providers globaux, Doc K4 §5)
  provider: ^6.1.2

  # Persistance locale (equivalent de logialvia-store.js / localStorage) — Doc K3 §3
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20

  # Lecture directe d'un fichier de sauvegarde AVANT de le restaurer : il faut
  # pouvoir l'ouvrir en LECTURE SEULE, sans lui appliquer la moindre migration.
  # AppDatabase.pourFichier migrerait le fichier controle, ce qui reviendrait
  # a modifier la sauvegarde qu'on est en train de verifier.
  sqlite3: ^3.5.1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Navigation (Shell Routes pour sidebar/topbar persistantes) — Doc E3 §3
  go_router: ^14.2.0

  # Formatage dates / devises (FCFA, locale fr) — Doc A1 §5
  # Version imposee par flutter_localizations du SDK Flutter (pin a 0.20.2),
  # et non par un choix libre : Doc K3 §3 indiquait ^0.19.0, incompatible.
  intl: ^0.20.2

  # Icones fideles au prototype (Material Symbols Outlined) — Doc 01 §5, option A confirmee
  material_symbols_icons: ^4.2719.0

  # Hachage des mots de passe (SHA-256 + sel) — Doc F1 "Point Ouvert", option confirmee
  crypto: ^3.0.3

  # Graphiques des tableaux de bord (CA vs Depenses, GMQ) — Doc E7 §5
  fl_chart: ^0.68.0

  # Fenetre Desktop (dimensions, titre) — Doc K3 §8
  window_manager: ^0.3.9
  pdf: ^3.13.0
  printing: ^5.15.0

  # Transmission des factures a e-MECeF (DGI Benin) — module Facturation MeCeF.
  http: ^1.2.0

  # Le jeton e-MECeF est un secret fiscal : il ne descend pas dans la base
  # SQLite, que la moindre sauvegarde recopie en clair. Meme regle que le mot
  # de passe SMTP (voir PARAMETRES_ENTREPRISE).
  flutter_secure_storage: ^9.2.2

  # NOTE : printing/pdf (Doc K3 §3) ne sont pas encore declares — ils seront ajoutes
  # avec le module qui les utilise reellement (Doc E9), pour ne pas embarquer de
  # dependance inutilisee (Strict Avoid §9).

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.16.0
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # POLICE ROBOTO (Doc 01 §2 / Doc K3 §4) — fournie en **fonte variable**.
  #
  # Les .ttf manquaient au depot. Reprendre ceux du SDK Flutter n'aurait rien
  # change : la fonte Roboto embarquee par le moteur est la serie STATIQUE
  # (100/300/400/500/700/900), sans 600 ni 800. Or l'application utilise
  # `FontWeight.w600` 22 fois et `w800` 23 fois, et le prototype web pose
  # `font-semibold` 315 fois et `font-extrabold` 127 fois — que Google Fonts
  # sert avec la fonte VARIABLE. Ces graisses etaient donc approchees par la
  # voisine la plus proche : c'est l'ecart de rendu que Doc K3 §4 signalait.
  #
  # La fonte variable (axe `wght` 100-900, meme fichier que celui servi au
  # prototype) rend ces graisses exactement. Licence SIL OFL 1.1, redistribuee
  # avec son `OFL.txt`.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
        - asset: assets/fonts/Roboto-Italic-Variable.ttf
          style: italic

  # Serie STATIQUE, reservee a l'export PDF : le paquet `pdf` embarque les
  # contours tels quels et ne tirerait d'une fonte variable que son instance
  # par defaut (400) — le gras des titres serait identique au corps de texte.
  # Declaree en `assets:` et non en `fonts:` : elle n'est pas une famille de
  # l'interface. Voir assets/fonts/README.md.
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
